<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Use Agent</title>
<style>
:root {
  --bg:       #0d1117;
  --surface:  #161b22;
  --border:   #30363d;
  --panel:    #1c2128;
  --accent:   #58a6ff;
  --text:     #e6edf3;
  --muted:    #7d8590;
  --success:  #3fb950;
  --warning:  #d29922;
  --error:    #f85149;
  --tool-bg:  rgba(56,139,253,0.1);
  --tool-bar: #388bfd;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 13px;
}

/* ── Header ────────────────────────────────────────────────────────────── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
header h1 { font-size: 14px; font-weight: 600; flex: 1; letter-spacing: -0.2px; }
header h1 span { color: var(--accent); }

/* ── Layout ────────────────────────────────────────────────────────────── */
#main { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ───────────────────────────────────────────────────────────── */
#sidebar {
  width: 200px;
  min-width: 200px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#sidebar-label {
  padding: 10px 12px 6px;
  font-size: 10px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  flex-shrink: 0;
}

#session-list { flex: 1; overflow-y: auto; }

.session-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.1s;
  min-width: 0;
}
.session-item:hover { background: rgba(255,255,255,0.04); }
.session-item.active {
  border-left-color: var(--accent);
  background: rgba(88,166,255,0.08);
}

.dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.dot-running   { background: var(--success); }
.dot-pending   { background: var(--warning); animation: blink 1s infinite; }
.dot-completed { background: var(--muted); }
.dot-error     { background: var(--error); }
.dot-unknown   { background: var(--muted); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

.si-info { flex: 1; min-width: 0; }
.si-title { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.si-meta  { font-size: 10px; color: var(--muted); margin-top: 1px; }

.si-del {
  opacity: 0; background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 13px; padding: 1px 4px; border-radius: 3px;
  transition: opacity .1s, color .1s; flex-shrink: 0;
}
.session-item:hover .si-del { opacity: 1; }
.si-del:hover { color: var(--error); }

/* ── Workspace ─────────────────────────────────────────────────────────── */
#workspace { flex: 1; display: flex; overflow: hidden; }

#empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px; color: var(--muted);
}
#empty-state p { font-size: 14px; }

/* ── Session Pane ──────────────────────────────────────────────────────── */
.pane {
  flex: 1; display: flex; flex-direction: column;
  border-right: 1px solid var(--border); min-width: 0; overflow: hidden;
}
.pane:last-child { border-right: none; }

.pane-header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 6px 12px; display: flex; align-items: center; gap: 7px;
  flex-shrink: 0; font-size: 11px;
}
.pane-header .ph-title { font-weight: 500; color: var(--text); flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pane-header .ph-id { color: var(--muted); font-family: monospace; font-size: 10px; }

/* ── VNC ───────────────────────────────────────────────────────────────── */
.vnc-wrap {
  flex: 3; background: #000; position: relative; min-height: 0;
}
.vnc-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
.vnc-placeholder {
  position: absolute; inset: 0; display: flex;
  align-items: center; justify-content: center;
  color: var(--muted); font-size: 12px;
}

/* ── Chat ──────────────────────────────────────────────────────────────── */
.chat-wrap {
  flex: 2; display: flex; flex-direction: column;
  min-height: 0; border-top: 1px solid var(--border);
}

.chat-log {
  flex: 1; overflow-y: auto; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 5px;
}

/* event types */
.ev { font-size: 12px; line-height: 1.55; }

.ev-user {
  align-self: flex-end; background: var(--accent); color: #000;
  border-radius: 10px 10px 2px 10px; padding: 7px 10px;
  max-width: 88%; white-space: pre-wrap; word-break: break-word; font-weight: 500;
}

.ev-text {
  background: var(--panel); border-radius: 2px 10px 10px 10px;
  padding: 7px 10px; white-space: pre-wrap; word-break: break-word;
}

.ev-tool {
  font-family: 'SF Mono', 'Consolas', monospace; font-size: 11px;
  padding: 4px 8px; background: var(--tool-bg);
  border-left: 2px solid var(--tool-bar);
  border-radius: 0 4px 4px 0; color: var(--muted);
}

.ev-result {
  font-size: 11px; color: var(--muted); padding: 3px 8px;
}
.ev-result img {
  max-width: 100%; max-height: 110px; border-radius: 4px;
  display: block; margin-top: 4px; cursor: zoom-in;
}

.ev-thinking {
  font-size: 11px; font-style: italic; color: var(--muted); padding: 2px 8px;
}

.ev-done {
  text-align: center; color: var(--success); font-size: 11px; padding: 4px 0;
}

.ev-error {
  color: var(--error); font-size: 11px; padding: 4px 8px;
  background: rgba(248,81,73,0.08); border-radius: 4px;
}

/* ── Input ─────────────────────────────────────────────────────────────── */
.input-row {
  display: flex; gap: 7px; padding: 8px;
  border-top: 1px solid var(--border); flex-shrink: 0;
}
.task-input {
  flex: 1; background: var(--panel); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px; padding: 7px 10px;
  font: inherit; font-size: 12px; resize: none; outline: none;
}
.task-input:focus { border-color: var(--accent); }
.task-input::placeholder { color: var(--muted); }
.task-input:disabled { opacity: .5; }

/* ── Buttons ───────────────────────────────────────────────────────────── */
.btn {
  background: var(--accent); color: #000; border: none;
  border-radius: 6px; padding: 7px 13px; font: inherit; font-size: 12px;
  font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: opacity .15s;
}
.btn:hover { opacity: .85; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn-sm { padding: 6px 11px; font-size: 12px; }
.btn-ghost {
  background: transparent; color: var(--accent); border: 1px solid var(--border);
}
.btn-ghost:hover { background: rgba(88,166,255,0.06); opacity: 1; }

/* ── Scrollbar ─────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>Computer Use <span>Agent</span></h1>
  <button class="btn btn-sm" id="btn-new">+ New Session</button>
</header>

<div id="main">
  <nav id="sidebar">
    <div id="sidebar-label">Sessions</div>
    <div id="session-list"></div>
  </nav>
  <div id="workspace"></div>
</div>

<script>
'use strict';

// ── Config ──────────────────────────────────────────────────────────────────
const API = '';  // same origin — no trailing slash

// ── State ───────────────────────────────────────────────────────────────────
const S = {
  sessions:     [],   // [{id, title, status, novnc_port, ...}]
  active:       [],   // up to 2 session IDs shown in workspace
  eventSources: {},   // id → EventSource
  events:       {},   // id → [event, ...]
};

// ── Fetch + poll ─────────────────────────────────────────────────────────────
async function loadSessions() {
  try {
    const r = await fetch(`${API}/sessions`);
    if (!r.ok) return;
    S.sessions = await r.json();
    // prune active list if sessions were deleted externally
    S.active = S.active.filter(id => S.sessions.some(s => s.id === id));
    renderSidebar();
    renderWorkspace();
  } catch (_) {}
}
setInterval(loadSessions, 3000);
loadSessions();

// ── Create session ───────────────────────────────────────────────────────────
async function createSession() {
  const btn = document.getElementById('btn-new');
  btn.disabled = true;
  btn.textContent = 'Creating…';
  try {
    const r = await fetch(`${API}/sessions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({}),
    });
    if (!r.ok) { alert(`Failed: ${r.status} ${await r.text()}`); return; }
    const session = await r.json();
    S.sessions.unshift(session);
    S.events[session.id] = [];
    activateSession(session.id);
  } finally {
    btn.disabled = false;
    btn.textContent = '+ New Session';
  }
}

// ── Delete session ───────────────────────────────────────────────────────────
async function deleteSession(id, e) {
  e.stopPropagation();
  closeStream(id);
  S.active = S.active.filter(x => x !== id);
  S.sessions = S.sessions.filter(s => s.id !== id);
  delete S.events[id];
  renderSidebar();
  renderWorkspace();
  await fetch(`${API}/sessions/${id}`, { method: 'DELETE' }).catch(() => {});
}

// ── Activate / deactivate session pane ──────────────────────────────────────
function activateSession(id) {
  if (S.active.includes(id)) {
    // deactivate
    S.active = S.active.filter(x => x !== id);
    closeStream(id);
  } else {
    if (S.active.length >= 2) closeStream(S.active.shift());
    S.active.push(id);
    S.events[id] = [];    // clear for a fresh DB replay
    openStream(id);
  }
  renderSidebar();
  renderWorkspace();
}

// ── SSE stream ───────────────────────────────────────────────────────────────
function openStream(id) {
  closeStream(id);
  const es = new EventSource(`${API}/sessions/${id}/stream`);
  S.eventSources[id] = es;

  es.onmessage = (e) => {
    let event;
    try { event = JSON.parse(e.data); } catch (_) { return; }
    appendEvent(id, event);
    if (event.type === 'done' || event.type === 'error') {
      es.close();
      delete S.eventSources[id];
      loadSessions();
    }
  };

  es.onerror = () => {
    const s = S.sessions.find(x => x.id === id);
    if (!s || s.status === 'completed' || s.status === 'error') {
      es.close();
      delete S.eventSources[id];
    }
  };
}

function closeStream(id) {
  const es = S.eventSources[id];
  if (es) { es.close(); delete S.eventSources[id]; }
}

// ── Send message ─────────────────────────────────────────────────────────────
async function sendMessage(id) {
  const ta = document.querySelector(`.task-input[data-id="${id}"]`);
  if (!ta) return;
  const text = ta.value.trim();
  if (!text) return;
  ta.value = '';
  ta.disabled = true;

  appendEvent(id, { type: '__user', content: text });

  try {
    const r = await fetch(`${API}/sessions/${id}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: text }),
    });
    if (!r.ok) {
      appendEvent(id, { type: 'error', content: `Send failed (${r.status})` });
      return;
    }
    // Reopen stream so new events come in (previous run's stream may be closed)
    openStream(id);
  } catch (err) {
    appendEvent(id, { type: 'error', content: String(err) });
  } finally {
    ta.disabled = false;
    ta.focus();
  }
}

// ── Append + render a single event ───────────────────────────────────────────
function appendEvent(id, event) {
  if (!S.events[id]) S.events[id] = [];
  S.events[id].push(event);
  const log = document.querySelector(`.chat-log[data-id="${id}"]`);
  if (!log) return;
  const el = buildEventEl(event);
  if (el) { log.appendChild(el); log.scrollTop = log.scrollHeight; }
}

function buildEventEl(ev) {
  const d = document.createElement('div');
  d.className = 'ev';
  switch (ev.type) {
    case '__user':
      d.className += ' ev-user';
      d.textContent = ev.content;
      break;
    case 'text':
      if (!ev.content?.trim()) return null;
      d.className += ' ev-text';
      d.textContent = ev.content;
      break;
    case 'tool_use': {
      d.className += ' ev-tool';
      const inp = ev.input || {};
      const action = inp.action
        ? `action=${inp.action}${inp.coordinate ? ` @ [${inp.coordinate}]` : ''}`
        : JSON.stringify(inp).slice(0, 80);
      d.textContent = `⚙ ${ev.name}  ${action}`;
      break;
    }
    case 'tool_result':
      d.className += ' ev-result';
      if (ev.is_image && ev.base64) {
        d.textContent = '📸 screenshot';
        const img = document.createElement('img');
        img.src = `data:image/png;base64,${ev.base64}`;
        img.onclick = () => window.open(img.src, '_blank');
        d.appendChild(img);
      } else if (ev.error) {
        d.textContent = `✗ ${ev.error}`;
        d.style.color = 'var(--error)';
      } else if (ev.content) {
        d.textContent = `↳ ${String(ev.content).slice(0, 300)}`;
      } else {
        return null;
      }
      break;
    case 'thinking':
      d.className += ' ev-thinking';
      d.textContent = `💭 ${String(ev.content).slice(0, 140)}…`;
      break;
    case 'done':
      d.className += ' ev-done';
      d.textContent = '✓ Task complete';
      break;
    case 'error':
      d.className += ' ev-error';
      d.textContent = `⚠ ${ev.content}`;
      break;
    default:
      return null;
  }
  return d;
}

// ── Sidebar ──────────────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('session-list');
  if (!S.sessions.length) {
    list.innerHTML = '<div style="padding:12px 10px;font-size:11px;color:var(--muted)">No sessions yet.</div>';
    return;
  }
  list.innerHTML = S.sessions.map(s => {
    const active = S.active.includes(s.id) ? 'active' : '';
    const title  = s.title ? s.title.slice(0, 28) : `Session ${s.id.slice(0, 8)}`;
    const age    = relTime(s.created_at);
    const status = s.status || 'unknown';
    return `
      <div class="session-item ${active}" onclick="activateSession('${s.id}')">
        <div class="dot dot-${status}"></div>
        <div class="si-info">
          <div class="si-title" title="${esc(title)}">${esc(title)}</div>
          <div class="si-meta">${status} · ${age}</div>
        </div>
        <button class="si-del" onclick="deleteSession('${s.id}', event)" title="Delete session">✕</button>
      </div>`;
  }).join('');
}

// ── Workspace ────────────────────────────────────────────────────────────────
function renderWorkspace() {
  const ws = document.getElementById('workspace');

  if (!S.active.length) {
    ws.innerHTML = `
      <div id="empty-state">
        <p>Select or create a session to get started.</p>
        <button class="btn btn-ghost" onclick="createSession()">+ New Session</button>
      </div>`;
    return;
  }

  // Build a set of which pane IDs are currently in the DOM
  const existing = {};
  ws.querySelectorAll('.pane[data-id]').forEach(el => { existing[el.dataset.id] = el; });

  // Remove panes no longer active
  Object.keys(existing).forEach(id => {
    if (!S.active.includes(id)) ws.removeChild(existing[id]);
  });

  // Remove empty state if present
  ws.querySelector('#empty-state')?.remove();

  // Add missing panes
  S.active.forEach(id => {
    if (!existing[id]) {
      const session = S.sessions.find(s => s.id === id) || { id, status: 'unknown' };
      const pane = buildPane(session);
      ws.appendChild(pane);
      // Replay buffered events
      const log = pane.querySelector('.chat-log');
      S.events[id]?.forEach(ev => {
        const el = buildEventEl(ev);
        if (el) log.appendChild(el);
      });
      if (log.lastChild) log.scrollTop = log.scrollHeight;
    } else {
      // Refresh header status for existing pane
      const s = S.sessions.find(x => x.id === id);
      if (s) refreshPaneHeader(id, s);
    }
  });
}

function buildPane(session) {
  const id  = session.id;
  const div = document.createElement('div');
  div.className = 'pane';
  div.dataset.id = id;

  const title  = session.title || `Session ${id.slice(0, 8)}`;
  const status = session.status || 'unknown';
  const vncUrl = session.novnc_port
    ? `http://localhost:${session.novnc_port}/vnc.html?autoconnect=true&resize=scale`
    : null;

  div.innerHTML = `
    <div class="pane-header" data-ph="${id}">
      <div class="dot dot-${status}" style="width:6px;height:6px"></div>
      <span class="ph-title" title="${esc(title)}">${esc(title)}</span>
      <span class="ph-id">${id.slice(0, 8)}</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div class="vnc-wrap">
        ${vncUrl
          ? `<iframe src="${vncUrl}" allowfullscreen></iframe>`
          : `<div class="vnc-placeholder">VNC not available</div>`}
      </div>
      <div class="chat-wrap">
        <div class="chat-log" data-id="${id}"></div>
        <div class="input-row">
          <textarea class="task-input" data-id="${id}" rows="2"
            placeholder="Describe a task… (Enter to send, Shift+Enter for newline)"></textarea>
          <button class="btn btn-sm" onclick="sendMessage('${id}')">Send</button>
        </div>
      </div>
    </div>`;

  div.querySelector('.task-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(id); }
  });

  return div;
}

function refreshPaneHeader(id, session) {
  const header = document.querySelector(`[data-ph="${id}"]`);
  if (!header) return;
  const dot = header.querySelector('.dot');
  if (dot) { dot.className = `dot dot-${session.status}`; }
  const titleEl = header.querySelector('.ph-title');
  if (titleEl && session.title) { titleEl.textContent = session.title.slice(0, 50); }
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function relTime(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  if (ms < 60_000)   return 'just now';
  if (ms < 3_600_000) return `${Math.floor(ms / 60_000)}m ago`;
  return `${Math.floor(ms / 3_600_000)}h ago`;
}

// ── Wire up ───────────────────────────────────────────────────────────────────
document.getElementById('btn-new').addEventListener('click', createSession);
</script>
</body>
</html>
